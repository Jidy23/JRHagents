name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from repository
        run: python -m pip install .
      - name: Test local toolkit and MCP
        run: python -m unittest discover -s tests -v
      - name: Verify console command
        run: jrhagents --version
      - name: Verify MCP console command
        run: jrhagents-mcp --help
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/site-model.js
      - name: Test browser-independent site model
        run: node --test tests/site.test.cjs
