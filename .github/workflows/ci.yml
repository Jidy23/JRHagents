name: Validate universal skill and docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify universal skill and 66 workflows
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify generated catalog consistency
        run: python tools/build_catalog.py --check
      - name: Verify read-only scanner
        run: python skills/jrhagents/scripts/project_scan.py --path . --max-files 30
      - name: Verify deterministic Skill package
        run: python -m unittest tests/test_release.py -v
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/catalog.js
          node --check docs/assets/universal.js
      - name: Validate catalog and site contracts
        run: node --test tests/catalog.test.cjs
