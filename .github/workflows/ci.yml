name: Validate universal skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill and documentation
        run: python -m unittest discover -s tests -v
      - name: Verify optional scanner is read-only
        run: python skills/jrhagents/scripts/project_scan.py --path . --max-files 30
  web:
    name: Site integrity and interaction-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend JS syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/guide.js
          node --check docs/assets/prompt-data.js
      - name: Test platform guidance and examples
        run: node --test tests/site-v24.test.cjs
      - name: Test HTML, assets and accessibility contracts
        run: python3 -m unittest discover -s tests -p test_site.py -v
