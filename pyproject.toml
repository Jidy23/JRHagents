[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jrhagents"
version = "16.0.0"
description = "Local-first super skill for project audits, plans and verified engineering workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "JRHagents contributors"}]
keywords = ["ai", "coding-agent", "skills", "codex", "claude-code", "gemini-cli", "audit"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
jrhagents = "jrhagents.cli:main"

[tool.setuptools.packages.find]
include = ["jrhagents*"]
